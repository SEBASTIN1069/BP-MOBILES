<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Total Accounts — BP Mobiles Hub Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#0B1120">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="BP Mobiles Hub logo" class="brand-logo">
      <span class="brand-text">BP<strong>MOBILES HUB</strong></span>
    </a>
    <nav class="main-nav">
      <a href="index.html">← Back to site</a>
    </nav>
  </div>
</header>

<main>
  <section class="section" id="checkingAuth">
    <p style="text-align:center; color: var(--muted);">Checking admin login…</p>
  </section>

  <section class="section admin-dashboard" id="accountsPage" hidden>
    <div class="accounts-page-head">
      <h1>👥 Total Accounts</h1>
      <button type="button" class="btn btn-ghost btn-sm" id="backBtn">← Back</button>
    </div>

    <p class="accounts-summary">Total accounts created: <strong id="accountsCount">…</strong></p>

    <input type="text" id="accountsSearchInput" class="admin-search" placeholder="Search by name or mobile number…">

    <div class="admin-table-wrap">
      <table class="admin-table" id="accountsTable">
        <thead><tr><th>Name</th><th>Mobile Number</th></tr></thead>
        <tbody><tr><td colspan="2">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="admin-pagination" id="accountsPagination"></div>
  </section>
</main>

<footer class="site-footer">
  <p class="footer-note">BP Mobiles Hub — Admin panel.</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="accounts.js"></script>
</body>
</html>
